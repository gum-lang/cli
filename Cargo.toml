[package]
name = "gum-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for the Gum markup language"
license = "MIT"

[[bin]]
name = "gum"
path = "src/main.rs"

[dependencies]
gum-core = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
